name: Refresh Facebook Page Token

on:
  schedule:
    # 1st of every month, 03:00 UTC (page tokens are renewed for 60 days each use)
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare .env.local from secrets
        run: |
          {
            echo "FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}"
            echo "FB_LONG_LIVED_USER_TOKEN=${{ secrets.FB_LONG_LIVED_USER_TOKEN }}"
            echo "FB_APP_ID=${{ secrets.FB_APP_ID }}"
            echo "FB_APP_SECRET=${{ secrets.FB_APP_SECRET }}"
            echo "FB_PAGE_NAME=${{ secrets.FB_PAGE_NAME }}"
            echo "VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}"
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }}"
          } > .env.local

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refresh and push token
        run: npm run fb:refresh